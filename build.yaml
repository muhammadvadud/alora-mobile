targets:
  $default:
    builders:
      source_gen|combining_builder:
        options:
          ignore_for_file:
            - type=lint
            - implicit_dynamic_parameter
            - implicit_dynamic_type
            - implicit_dynamic_method
            - strict_raw_type
      freezed:
        options:
          make_collections_unmodifiable: false
      json_serializable:
        options:
          explicit_to_json: true
          field_rename: snake
          include_if_null: false
          checked: true
      riverpod_generator:
        options:
          provider_name_prefix: ''
