name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - run: sudo apt-get update && sudo apt-get install -y lcov bc
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - name: Tarjima qilinmagan kalitlar (rules §10.4)
        run: |
          if [ -s l10n-errors.txt ] && [ "$(cat l10n-errors.txt)" != "{}" ]; then
            echo "Tarjima qilinmagan kalitlar bor:"; cat l10n-errors.txt; exit 1
          fi
      - run: dart format --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart run custom_lint
      - run: flutter test --coverage --concurrency=2 test/unit test/widget test/golden test/integration

      - name: Coverage ≥ 70% (rules §15.2)
        run: |
          lcov --remove coverage/lcov.info '*.g.dart' '*.freezed.dart' 'lib/app/l10n/*' -o coverage/filtered.info
          COVERAGE=$(lcov --summary coverage/filtered.info | grep "lines......:" | grep -Eo "[0-9]+\.[0-9]+" | head -1)
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage 70% dan past"; exit 1
          fi

      # --analyze-size Flutter 3.47.4 da integration_test plagini bilan xato beradi — hajm fayldan o'lchanadi
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define-from-file=env/prod.json $(tool/version_defines.sh)
      - name: APK ≤ 40 MB (rules §13)
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SIZE_MB=$(( $(stat -c %s "$APK") / 1024 / 1024 ))
          echo "APK: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 40 ]; then echo "APK 40 MB dan katta"; exit 1; fi
