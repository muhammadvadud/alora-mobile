include: package:flutter_lints/flutter.yaml

analyzer:
  # custom_lint (riverpod_lint) CLI orqali ishlaydi: `dart run custom_lint` (CI va lefthook)
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
    - require_trailing_commas
    - prefer_const_constructors
    - use_key_in_widget_constructors
    - avoid_dynamic_calls
